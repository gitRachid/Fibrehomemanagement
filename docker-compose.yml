# Stack locale (développement) — API + MongoDB + Redis + MinIO
#
# Démarrage :
#   docker compose up -d --build
#
# API : http://localhost:8084/api/health
# MinIO console : http://localhost:9001 (minioadmin / minioadmin)

services:
  api:
    build:
      context: ./backendfiber
      dockerfile: Dockerfile
    container_name: fiber-api-dev
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file:
      - path: ./deploy/env/api.dev.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 8084
      MONGODB_URI: mongodb://mongodb:27017/fiberhomemanage
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: fiber-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      API_REQUIRE_AUTH: "false"
      PUBLIC_API_BASE_URL: http://localhost:8084
      CORS_ORIGIN: http://localhost:8081,http://localhost:3000,exp://localhost:8081
      JWT_SECRET: dev_only_change_me
      ADMIN_EMAIL: admin@fiber.local
      ADMIN_PASSWORD: admin123
    volumes:
      - ./backendfiber/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: fiber-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: fiber-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  minio:
    image: minio/minio:latest
    container_name: fiber-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

volumes:
  mongo_dev_data:
  redis_dev_data:
  minio_dev_data:
