version: "3.9"

services:
  api:
    build:
      context: ../backendfiber
      dockerfile: Dockerfile
    container_name: fiber-api
    restart: unless-stopped
    env_file:
      - ./env/api.env
    environment:
      - NODE_ENV=production
      - PORT=8084
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - redis
      - minio
      - mongodb
    volumes:
      - ../backendfiber/uploads:/app/uploads
    networks:
      - fiber-net

  worker:
    build:
      context: ../backendfiber
      dockerfile: Dockerfile
    container_name: fiber-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - ./env/api.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - redis
      - minio
      - mongodb
    networks:
      - fiber-net

  nginx:
    image: nginx:1.27-alpine
    container_name: fiber-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - fiber-net

  mongodb:
    image: mongo:7
    container_name: fiber-mongodb
    restart: unless-stopped
    command: ["--bind_ip_all", "--replSet", "rs0"]
    volumes:
      - mongo_data:/data/db
    networks:
      - fiber-net

  redis:
    image: redis:7-alpine
    container_name: fiber-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - fiber-net

  minio:
    image: minio/minio:latest
    container_name: fiber-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/minio.env
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - fiber-net

volumes:
  mongo_data:
  redis_data:
  minio_data:

networks:
  fiber-net:
    driver: bridge
